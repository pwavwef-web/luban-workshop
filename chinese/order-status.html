<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>订单状态 | 鲁班工坊餐厅</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png">
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="stylesheet" href="/assets/css/site.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background: #f7f3ef; color: #1c1917; }
    </style>
</head>
<body>
    <div data-luban-header="account-zh" data-luban-header-back-href="index.html#my-orders" data-luban-header-back-label="返回订单"></div>

    <header class="relative overflow-hidden bg-stone-950 pt-28 pb-12 text-white">
        <div class="absolute inset-0">
            <img src="/assets/luban-noodle-spread.jpg" srcset="/assets/luban-noodle-spread-480.jpg 480w, /assets/luban-noodle-spread.jpg 735w" sizes="100vw" alt="" aria-hidden="true" width="735" height="420" class="h-full w-full object-cover">
            <div class="absolute inset-0" style="background: linear-gradient(90deg, rgba(28,25,23,0.94) 0%, rgba(28,25,23,0.76) 48%, rgba(28,25,23,0.5) 100%);"></div>
            <div class="absolute inset-0" style="background: radial-gradient(circle at top left, rgba(185,28,28,0.36), transparent 34%);"></div>
        </div>
        <div class="relative mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
            <p class="text-red-200 text-xs font-bold uppercase tracking-widest">Order Tracking</p>
            <h1 class="serif text-4xl font-bold mt-3 sm:text-5xl">订单状态</h1>
            <p class="mt-4 max-w-2xl text-stone-200">Track one order at a time and manage customer-allowed actions from this page.</p>
        </div>
    </header>

    <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 -mt-10 pb-16">
        <section id="auth-gate" class="panel bg-white p-6 sm:p-8">
            <h2 class="serif text-3xl font-bold text-stone-900">登录以查看此订单</h2>
            <p class="mt-3 text-stone-600">Only the customer account that placed the order can view this page.</p>
        </section>

        <section id="order-content" class="hidden space-y-6">
            <article class="panel bg-white p-6 sm:p-8">
                <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-widest text-red-700">Secure Order</p>
                        <h2 id="order-title" class="serif mt-2 text-3xl font-bold text-stone-900">Order</h2>
                        <p id="order-created" class="mt-2 text-stone-600"></p>
                        <p id="order-status-note" class="mt-3 text-sm text-stone-600"></p>
                    </div>
                    <span id="order-status-pill" class="rounded-full bg-stone-100 px-4 py-2 text-xs font-bold text-stone-700">PENDING</span>
                </div>
                <div id="order-items" class="mt-6 space-y-4"></div>
                <div class="mt-6 space-y-3 border-t border-stone-100 pt-5">
                    <div class="flex items-center justify-between">
                        <span class="text-stone-500">Subtotal</span>
                        <span id="order-subtotal" class="font-semibold text-stone-900">₵0.00</span>
                    </div>
                    <div id="order-packaging-row" class="hidden items-start justify-between gap-4">
                        <span>
                            <span class="block text-stone-500">Packaging fee</span>
                            <span id="order-packaging-note" class="mt-0.5 block text-xs text-stone-400">Take out only, drinks excluded.</span>
                        </span>
                        <span id="order-packaging-fee" class="font-semibold text-stone-900">₵0.00</span>
                    </div>
                    <div class="flex items-center justify-between border-t border-stone-100 pt-3">
                        <span class="text-lg font-semibold text-stone-900">Total</span>
                        <span id="order-total" class="text-lg font-bold text-stone-900">₵0.00</span>
                    </div>
                </div>
                <div class="mt-6 flex flex-col sm:flex-row gap-3">
                    <button id="cancel-btn" type="button" class="hidden rounded-md bg-red-700 px-5 py-3 font-semibold text-white hover:bg-red-800">Cancel Order</button>
                    <button id="delete-btn" type="button" class="hidden rounded-md border border-stone-300 px-5 py-3 font-semibold text-stone-800 hover:bg-stone-50">Delete Order</button>
                    <button id="refresh-btn" type="button" class="rounded-md border border-stone-300 px-5 py-3 font-semibold text-stone-800 hover:bg-stone-50">Refresh Status</button>
                </div>
            </article>
            <div id="order-feedback" class="hidden rounded-md p-4 text-sm"></div>
        </section>
    </main>

    <div data-luban-footer></div>
    <script src="/assets/js/site-footer.js?v=20260629-footer-glow"></script>
    <script src="/assets/js/site-config.js"></script>
    <script src="/assets/js/luban-client.js"></script>
    <script src="/assets/js/customer-experience.js?v=20260603-cx"></script>
    <script src="/assets/js/firebase-modular.bundle.js"></script>
    <script src="/assets/js/site-header.js"></script>
    <script src="/assets/js/firebase-config.js"></script>
    <script>
        initLubanFirebase(firebase);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const orderId = new URLSearchParams(window.location.search).get('order');
        let currentUser = null;
        let currentOrder = null;

        function getOrderStatusMeta(status) {
            const normalized = String(status || 'pending').toLowerCase();
            if (normalized === 'requested') {
                return {
                    label: 'PRE-ORDER REQUEST',
                    className: 'rounded-full bg-amber-100 px-4 py-2 text-xs font-bold text-amber-800',
                    note: 'Staff will accept or reject this pre-order request when service opens.'
                };
            }
            if (normalized === 'accepted') {
                return {
                    label: 'ACCEPTED',
                    className: 'rounded-full bg-green-100 px-4 py-2 text-xs font-bold text-green-800',
                    note: 'Staff accepted this pre-order request and will update it when preparation starts.'
                };
            }
            if (normalized === 'rejected') {
                return {
                    label: 'NOT ACCEPTED',
                    className: 'rounded-full bg-red-100 px-4 py-2 text-xs font-bold text-red-800',
                    note: 'This pre-order request was not accepted. Please contact the restaurant if you need help.'
                };
            }
            if (normalized === 'pending') {
                return {
                    label: 'PENDING',
                    className: 'rounded-full bg-yellow-100 px-4 py-2 text-xs font-bold text-yellow-800',
                    note: 'The team has received this order and will update it when preparation starts.'
                };
            }
            if (normalized === 'preparing') {
                return {
                    label: 'PREPARING',
                    className: 'rounded-full bg-blue-100 px-4 py-2 text-xs font-bold text-blue-800',
                    note: 'The kitchen is preparing this order.'
                };
            }
            if (normalized === 'completed') {
                return {
                    label: 'READY',
                    className: 'rounded-full bg-green-100 px-4 py-2 text-xs font-bold text-green-800',
                    note: 'This order has been marked complete.'
                };
            }
            if (normalized === 'cancelled') {
                return {
                    label: 'CANCELLED',
                    className: 'rounded-full bg-red-100 px-4 py-2 text-xs font-bold text-red-800',
                    note: 'This order was cancelled.'
                };
            }
            return {
                label: normalized.toUpperCase(),
                className: 'rounded-full bg-stone-100 px-4 py-2 text-xs font-bold text-stone-700',
                note: ''
            };
        }

        function getRequestedForText(order) {
            if (!order) return '';
            if (order.requestedForLabel) return order.requestedForLabel;
            if (order.requestedFor && order.requestedFor.toDate) {
                return order.requestedFor.toDate().toLocaleString('en-GH', {
                    timeZone: 'Africa/Accra',
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hourCycle: 'h23'
                });
            }
            return '';
        }

        function showUxToast(message, type, duration) {
            document.dispatchEvent(new CustomEvent('luban:toast', {
                detail: { message, type, duration }
            }));
        }

        function showUxConfirm(title, message, options) {
            return new Promise(resolve => {
                document.dispatchEvent(new CustomEvent('luban:confirm', {
                    detail: { title, message, options, resolve }
                }));
            });
        }

        function celebrateUxOrder(message) {
            document.dispatchEvent(new CustomEvent('luban:celebrate-order', {
                detail: { message }
            }));
        }

        function canCancelOrder(order) {
            if (!order || order.status !== 'pending' || !order.createdAt || !order.createdAt.toDate) return false;
            return (Date.now() - order.createdAt.toDate().getTime()) <= 5 * 60 * 1000;
        }

        function showFeedback(message, isError) {
            showUxToast(message, isError ? 'error' : 'success');
        }

        function maybeCelebratePlacedOrder() {
            let placedOrderId = '';
            try {
                placedOrderId = window.sessionStorage.getItem('luban:order-success') || '';
            } catch (storageError) {}
            if (!placedOrderId || placedOrderId !== orderId) return;
            let successKind = 'order';
            try {
                successKind = window.sessionStorage.getItem('luban:order-success-kind') || 'order';
            } catch (storageError) {}
            try {
                window.sessionStorage.removeItem('luban:order-success');
                window.sessionStorage.removeItem('luban:order-success-kind');
            } catch (storageError) {}
            celebrateUxOrder(successKind === 'request' ? 'Pre-order request sent. Track it here.' : 'Order placed. Track it here.');
        }

        async function loadOrder() {
            if (!currentUser || !orderId) return;
            const snap = await db.collection('orders').doc(orderId).get();
            if (!snap.exists) throw new Error('Order not found.');
            const order = snap.data() || {};
            currentOrder = order;
            const itemSubtotal = (order.items || []).reduce((sum, item) => sum + Number(item.price || 0) * Number(item.quantity || 0), 0);
            const subtotal = Number(order.subtotal ?? itemSubtotal);
            const packagingFee = Number(order.packagingFee || 0);
            const packagingItemCount = Number(order.packagingItemCount || 0);
            const packagingRow = document.getElementById('order-packaging-row');
            document.getElementById('order-title').textContent = `Order #${orderId.slice(-6).toUpperCase()}`;
            document.getElementById('order-created').textContent = order.createdAt && order.createdAt.toDate ? `Placed ${order.createdAt.toDate().toLocaleString()}` : 'Placed recently';
            const statusMeta = getOrderStatusMeta(order.status);
            const requestedForText = getRequestedForText(order);
            const normalizedStatus = String(order.status || '').toLowerCase();
            const statusNote = ['requested', 'accepted', 'rejected'].includes(normalizedStatus) && requestedForText
                ? `${statusMeta.note} Requested for ${requestedForText}.`
                : statusMeta.note;
            document.getElementById('order-status-note').textContent = statusNote;
            document.getElementById('order-subtotal').textContent = lubanClient.formatMoney(subtotal);
            document.getElementById('order-packaging-fee').textContent = lubanClient.formatMoney(packagingFee);
            document.getElementById('order-packaging-note').textContent = packagingItemCount
                ? `₵${Number(order.packagingFeePerDish || 5)} x ${packagingItemCount} ${packagingItemCount === 1 ? 'dish' : 'dishes'}; drinks excluded.`
                : 'Drinks are exempt from the take out packaging fee.';
            packagingRow.classList.toggle('hidden', packagingFee <= 0);
            packagingRow.classList.toggle('flex', packagingFee > 0);
            document.getElementById('order-total').textContent = lubanClient.formatMoney(order.total || 0);
            const statusPill = document.getElementById('order-status-pill');
            statusPill.textContent = statusMeta.label;
            statusPill.className = statusMeta.className;
            document.getElementById('order-items').innerHTML = (order.items || []).map((item) => `
                <article class="rounded-lg border border-stone-200 p-4">
                    <div class="flex items-center justify-between gap-4">
                        <div>
                            <h3 class="font-semibold text-stone-900">${item.name}</h3>
                            <p class="mt-1 text-sm text-stone-500">Qty ${item.quantity}</p>
                        </div>
                        <strong>${lubanClient.formatMoney(Number(item.price || 0) * Number(item.quantity || 0))}</strong>
                    </div>
                </article>
            `).join('');
            const isRequest = String(order.status || '').toLowerCase() === 'requested';
            const cancelBtn = document.getElementById('cancel-btn');
            cancelBtn.textContent = isRequest ? 'Withdraw Request' : 'Cancel Order';
            cancelBtn.classList.toggle('hidden', !(isRequest || canCancelOrder(order)));
            document.getElementById('delete-btn').classList.toggle('hidden', !['completed', 'cancelled', 'rejected'].includes(String(order.status || '').toLowerCase()));
        }

        auth.onAuthStateChanged(async (user) => {
            currentUser = user;
            document.getElementById('auth-gate').classList.toggle('hidden', Boolean(user));
            document.getElementById('order-content').classList.toggle('hidden', !user);
            if (!user) return;
            if (!orderId) {
                showFeedback('This order page is missing the order reference.', true);
                return;
            }
            try {
                await loadOrder();
                maybeCelebratePlacedOrder();
            } catch (error) {
                showFeedback(error.message || 'Could not load this order.', true);
            }
        });

        document.getElementById('refresh-btn').addEventListener('click', async () => {
            try {
                await loadOrder();
                showFeedback('Order refreshed.', false);
            } catch (error) {
                showFeedback(error.message || 'Could not refresh the order.', true);
            }
        });

        document.getElementById('cancel-btn').addEventListener('click', async () => {
            if (!currentUser || !orderId) return;
            const isRequest = currentOrder && String(currentOrder.status || '').toLowerCase() === 'requested';
            const confirmed = await showUxConfirm(
                isRequest ? 'Withdraw Request' : 'Cancel Order',
                isRequest ? 'Withdraw this pre-order request before staff accepts it?' : 'Cancel this order? This can only be done while the order is still pending.',
                { confirmLabel: isRequest ? 'Withdraw Request' : 'Cancel Order' }
            );
            if (!confirmed) return;
            try {
                await lubanClient.api('/cancelOwnOrder', {
                    method: 'POST',
                    user: currentUser,
                    body: { orderId }
                });
                await loadOrder();
                showFeedback(isRequest ? 'Pre-order request withdrawn.' : 'Order cancelled.', false);
            } catch (error) {
                showFeedback(error.message || (isRequest ? 'Could not withdraw this request.' : 'Could not cancel this order.'), true);
            }
        });

        document.getElementById('delete-btn').addEventListener('click', async () => {
            if (!currentUser || !orderId) return;
            const confirmed = await showUxConfirm('Delete Order', 'Delete this order permanently? This cannot be undone.', { confirmLabel: 'Delete Order' });
            if (!confirmed) return;
            try {
                await lubanClient.api('/deleteOwnOrder', {
                    method: 'POST',
                    user: currentUser,
                    body: { orderId }
                });
                showFeedback('Order deleted. Redirecting back to the homepage...', false);
                setTimeout(() => { window.location.href = 'index.html#my-orders'; }, 1000);
            } catch (error) {
                showFeedback(error.message || 'Could not delete this order.', true);
            }
        });
    </script>
</body>
</html>
